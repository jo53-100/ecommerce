<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lovefoot · Gestion{% endblock %}</title>
<style>
  :root{
    --bg:#f0f0f0; --surface:#fff; --ink:#1c2733; --accent:#1a4f8a;
    --success:#1a7a45; --danger:#b03030; --warn:#c07000; --muted:#606060;
    --line:#e3e6ea; --low-bg:#fff8e1; --low-ink:#7d5c00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45}
  .num{font-variant-numeric:tabular-nums}
  header{background:var(--accent);color:#fff;padding:14px 22px;display:flex;
    align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{opacity:.8;font-size:12px;margin-top:2px}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
  nav.tabs a{font-size:13px;padding:6px 11px;border-radius:6px;text-decoration:none;
    background:#15407a;color:#fff;border:1px solid #2f5e96}
  nav.tabs a.primary{background:#fff;color:var(--accent);font-weight:600;border:0}
  main{padding:22px;max-width:1180px;margin:0 auto}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px}
  .panel h2{font-size:14px;margin:0 0 4px;font-weight:600}
  .panel .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  form.entry p{margin:0 0 14px}
  form.entry label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:4px;font-weight:600}
  form.entry input,form.entry select,form.entry textarea{width:100%;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;color:var(--ink)}
  form.entry input[type=checkbox]{width:auto}
  form.entry .helptext{font-size:11px;color:var(--muted);display:block;margin-top:3px}
  form.entry ul.errorlist{list-style:none;margin:4px 0 0;padding:0;color:var(--danger);font-size:12px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
  button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;
    padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer}
  a.cancel{color:var(--muted);text-decoration:none;font-size:13px}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
  .msg.success{background:#e7f4ec;color:var(--success);border:1px solid #bfe2cd}
  .msg.error{background:#fbeaea;color:var(--danger);border:1px solid #eccaca}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.r,th.r{text-align:right}
  tr.low td{background:var(--low-bg);color:var(--low-ink)}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .pill.sale{background:#e8f1fb;color:var(--accent)}
  .pill.use{background:#f0ece4;color:var(--warn)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Lovefoot · Gestion</h1>
    <div class="sub">{% block subtitle %}{% endblock %}</div>
  </div>
  <nav class="tabs">
    <a class="primary" href="{% url 'clinic:dashboard' %}">Dashboard</a>
    <a href="{% url 'clinic:movimiento_nuevo' %}">+ Movimiento</a>
    <a href="{% url 'clinic:inventario' %}">Inventario</a>
    <a href="{% url 'clinic:empleada_nueva' %}">+ Empleada</a>
    <a href="{% url 'clinic:gasto_nuevo' %}">+ Gasto</a>
    <a href="/admin/">Admin</a>
  </nav>
</header>
<main>
  {% if messages %}
    {% for m in messages %}
      <div class="msg {{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
